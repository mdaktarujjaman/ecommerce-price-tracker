name: Data Mining Pipeline

on:
  schedule:
    - cron: '0 */6 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 pandas gspread oauth2client

      - name: Run Scraper
        run: python scraper.py

      - name: Run Cleaner
        run: python cleaner.py

      - name: Upload Data to Google Sheets
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python upload_to_sheets.py

      - name: Upload Data as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-data
          path: clean_data.csv