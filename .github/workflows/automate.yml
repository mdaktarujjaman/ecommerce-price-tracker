name: Data Mining Pipeline

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # beautifulsoup4 removed as we are using JSON API
          pip install requests pandas gspread oauth2client

      - name: Run Scraper
        run: python scraper.py

      - name: Run Cleaner
        # Note: If your cleaner.py is not needed for the new time-series logic, you can remove this step.
        run: python cleaner.py

      - name: Upload Data to Google Sheets
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python upload_to_sheets.py

      - name: Upload Data as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-scraped-data
          # Changed to raw.json since this is where the new pipeline gets data
          path: data/raw/raw.json