name: Data Mining Pipeline

on:
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টায় একবার রান হবে
  workflow_dispatch: # চাইলে ম্যানুয়ালিও রান করতে পারবে

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 pandas

      - name: Run Scraper
        run: python scraper.py

      - name: Run Cleaner
        run: python cleaner.py

      - name: Upload Data as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-data
          path: clean_data.csv